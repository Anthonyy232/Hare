
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Test</title>
</head>
<body>
    <h1>Video Test Page</h1>
    <div id="player" style="position:relative;width:640px;height:360px">
    <video id="test-video" width="640" height="360" controls muted preload="auto">
        <source src="/media.wav" type="audio/wav">
        Your browser does not support the video tag.
    </video>
    </div>
    <input aria-label="Comment" />
    <div contenteditable="true" aria-label="Rich text"><span>Editable text</span></div>
    <div id="shadow-host"></div>
    <script>
        const params = new URLSearchParams(location.search);
        if (params.has('visual')) document.getElementById('test-video').src = '/motion.webm';
        if (params.has('empty') || params.has('frame')) document.getElementById('player').remove();
        if (params.has('frame')) {
          const frame = document.createElement('iframe');
          frame.src = 'http://localhost:41739/video.html';
          frame.width = '700'; frame.height = '500'; frame.title = 'Embedded player';
          document.body.append(frame);
        }
        document.getElementById('shadow-host').attachShadow({ mode: 'open' }).innerHTML = '<div id="nested-host"></div>';
    </script>
</body>
</html>
