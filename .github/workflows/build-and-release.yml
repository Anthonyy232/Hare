name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify extension
    uses: ./.github/workflows/checks.yml

  build:
    name: Build ${{ matrix.browser }} Extension
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "Release tag must match package.json version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package extension
        run: npx wxt zip -b ${{ matrix.browser }}
      - name: Upload submission packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.browser }}-package-v${{ steps.version.outputs.version }}
          path: .output/*.zip
          # WXT writes its packages under a hidden directory; only ZIPs are selected.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts/
          pattern: '*-package-v*'
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: artifacts/*.zip
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
