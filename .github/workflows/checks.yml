name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Not github.workflow: when called from the release workflow that would share its group and cancel it.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
