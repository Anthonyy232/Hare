version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 5
    groups:
      minor-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
    ignore:
      # svelte-check's language service still needs TypeScript 6 (TS 7 runs as @typescript/native via --tsgo);
      # unblocked when svelte-check accepts typescript ^7 without the alias
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 5
    groups:
      minor-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
    commit-message:
      prefix: chore(deps)
